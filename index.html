<title>Central Clik</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@600;700;800&family=Lato:wght@400;700;900&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: menu lateral vinho com o logo da Clik + área de trabalho rolável; no celular o menu vira faixa horizontal no topo */
:root{
  --bg:#F7F2F4; --surface:#FFFFFF; --surface-2:#F0E6EA; --line:#E4D5DB; --fg:#2B0F1A; --muted:#7A5E69;
  --wine:#5B1B30; --accent:#AD2F58; --accent-ink:#FFFFFF; --accent-soft:#F7DDE6;
  --ok:#1E7F52; --ok-soft:#DCF1E5; --warn:#A0650F; --warn-soft:#FAEDD2; --bad:#C0352B; --bad-soft:#FBE0DD; --info:#3352CC; --info-soft:#E0E6FB;
  --side:#5B1B30; --side-fg:#E7CCD6; --side-active:#FFFFFF; --side-hover:rgba(255,255,255,.08);
  --f-display:"Crimson Pro", Georgia, "Times New Roman", serif;
  --f-body:"Lato", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#150A0F; --surface:#21121A; --surface-2:#2C1822; --line:#3D2430; --fg:#F6ECF0; --muted:#B99BA7;
  --wine:#F0A3BC; --accent:#E35A86; --accent-ink:#22070F; --accent-soft:#45172A;
  --ok:#43C286; --ok-soft:#14321F; --warn:#E5AC45; --warn-soft:#3A2A10; --bad:#F26B5F; --bad-soft:#3D1815; --info:#8098FF; --info-soft:#1C2347;
  --side:#2E0E19; --side-fg:#D2B2BE; --side-active:#FFFFFF; --side-hover:rgba(255,255,255,.06); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#150A0F; --surface:#21121A; --surface-2:#2C1822; --line:#3D2430; --fg:#F6ECF0; --muted:#B99BA7;
  --wine:#F0A3BC; --accent:#E35A86; --accent-ink:#22070F; --accent-soft:#45172A;
  --ok:#43C286; --ok-soft:#14321F; --warn:#E5AC45; --warn-soft:#3A2A10; --bad:#F26B5F; --bad-soft:#3D1815; --info:#8098FF; --info-soft:#1C2347;
  --side:#2E0E19; --side-fg:#D2B2BE; --side-active:#FFFFFF; --side-hover:rgba(255,255,255,.06); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--side)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
a{color:var(--accent)}
.lg-d{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lg-l{display:none}:root:not([data-theme="light"]) .lg-d{display:block}}
:root[data-theme="dark"] .lg-l{display:none}:root[data-theme="dark"] .lg-d{display:block}
.app{display:grid;grid-template-columns:240px 1fr;height:100%}
.side{background:var(--side);color:var(--side-fg);display:flex;flex-direction:column;gap:14px;padding:22px 14px;overflow-y:auto}
.brand{display:block;padding:0 10px 4px}
.brand img{width:150px;height:auto;display:block}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-group{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--side-fg);opacity:.65;padding:12px 10px 4px;font-weight:700}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--side-fg);text-decoration:none;white-space:nowrap}
.nav a:hover{background:var(--side-hover);color:var(--side-active)}
.nav a.on{background:rgba(255,255,255,.12);color:var(--side-active);font-weight:700}
.nav a.on svg{color:#F078A0}
.nav a .count{margin-left:auto;background:#F078A0;color:#2B0F1A;font-size:11px;font-weight:900;border-radius:20px;padding:1px 7px}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 8px 0;border-top:1px solid rgba(255,255,255,.12);font-size:12.5px;min-width:0}
.me img,.me .ini{width:30px;height:30px;border-radius:50%;flex:none}
.me .ini{background:#F078A0;color:#2B0F1A;display:grid;place-items:center;font-weight:900;font-size:12px}
.me div{min-width:0}
.me span{display:block;color:var(--side-active);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me button{background:none;border:0;color:var(--side-fg);text-decoration:underline;cursor:pointer;padding:0;font-size:12px}
main{overflow-y:auto;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:26px 18px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.top h1{font-size:34px;font-weight:700;color:var(--wine);line-height:1.05}
.top p{margin:6px 0 0;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#view{padding-block:0 40px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px;min-width:0}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 13px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);background:var(--surface-2)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.sm{padding:5px 9px;font-size:12.5px}
.btn:disabled{opacity:.6;cursor:wait}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select.f,input.f{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:3px}
.kpi span{font-size:11px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.kpi b{font-family:var(--f-display);font-size:34px;font-weight:700;font-variant-numeric:tabular-nums lining-nums;line-height:1.1;color:var(--wine)}
.kpi small{color:var(--muted)}
.kpi.alert b{color:var(--bad)}
.kpi.good b{color:var(--ok)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{font-size:20px;font-weight:700;display:flex;align-items:center;gap:8px}
.panel h2 .pill{margin-left:auto;font-family:var(--f-body)}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:9px 4px;border-top:1px solid var(--line);cursor:pointer;min-width:0;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%;color:inherit}
.row:first-child{border-top:0}
.row:hover{background:var(--surface-2)}
.row .main{flex:1;min-width:0}
.row .main b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .main small{color:var(--muted)}
.row .meta{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;border-radius:20px;padding:2px 9px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.empty{color:var(--muted);padding:14px 4px;font-size:13.5px}
.banner{border:1px dashed var(--line);border-radius:var(--r);padding:14px 16px;color:var(--muted);background:var(--surface)}
.banner b{color:var(--fg)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;align-items:flex-start}
.col{flex:none;width:272px;background:var(--surface-2);border-radius:var(--r);display:flex;flex-direction:column;max-height:calc(100vh - 230px)}
.col header{display:flex;justify-content:space-between;align-items:center;padding:12px 12px 8px;font-weight:900;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--wine)}
.col header b{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:500}
.col-body{display:flex;flex-direction:column;gap:8px;padding:0 8px 10px;overflow-y:auto;min-height:60px}
.col.over{outline:2px dashed var(--accent);outline-offset:-2px}
.empty-col{color:var(--muted);font-size:12.5px;text-align:center;margin:12px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 11px;display:flex;flex-direction:column;gap:7px;cursor:grab;text-align:left;width:100%}
.card:hover{border-color:var(--muted)}
.card .t{font-weight:700;line-height:1.3}
.card .l{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.card img,.card video{border-radius:6px;max-height:110px;object-fit:cover;width:100%;display:block;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700}
.cal-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cal-head h2{font-size:26px;min-width:180px;color:var(--wine);text-transform:capitalize}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 12px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--wine);color:var(--bg)}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--line);gap:1px}
.month .wd{background:var(--surface-2);padding:7px 8px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:900;color:var(--muted)}
.day{background:var(--surface);min-height:108px;padding:6px;display:flex;flex-direction:column;gap:4px;cursor:pointer;min-width:0}
.day.out{background:var(--bg);color:var(--muted)}
.day .n{font-family:var(--f-mono);font-size:12px}
.day.today .n{background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:0 7px;align-self:flex-start}
.ev{font-size:11.5px;border-radius:5px;padding:3px 6px;background:var(--surface-2);border-left:3px solid var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;text-align:left;border-top:0;border-right:0;border-bottom:0;width:100%;color:inherit}
.ev.publicado{opacity:.55;text-decoration:line-through}
.more{font-size:11px;color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:8px;overflow-x:auto}
.week .wcol{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px;display:flex;flex-direction:column;gap:6px;min-height:240px}
.week .wcol.today{border-color:var(--accent)}
.week .wcol h3{font-family:var(--f-body);font-size:12px;font-weight:900;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.clients{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.cc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;width:100%;color:inherit}
.cc:hover{border-color:var(--muted)}
.cc .hd{display:flex;align-items:center;gap:10px}
.av{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;color:#fff;flex:none;font-size:17px}
.cc h3{font-size:20px;font-weight:700;line-height:1.15}
.cc small{color:var(--muted)}
.cc.ex{opacity:.8}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.bar{height:6px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:6px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 14px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--wine);border-bottom-color:var(--accent)}
.tabs button .pill{margin-left:6px}
.check{display:flex;align-items:center;gap:10px;padding:9px 6px;border-top:1px solid var(--line);cursor:pointer}
.check:first-child{border-top:0}
.check input{width:17px;height:17px;accent-color:var(--ok)}
.check.done span{color:var(--muted);text-decoration:line-through}
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.dl div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.dl dt{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:900;margin-bottom:4px}
.dl dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.dl dd.none{color:var(--muted);font-style:italic}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:9px 12px;text-align:left;border-top:1px solid var(--line);white-space:nowrap}
th{border-top:0;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);font-weight:900}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
td .pos{color:var(--ok)} td .neg{color:var(--bad)}
.chart{width:100%;height:auto;display:block}
.vault{display:flex;flex-direction:column;gap:10px;max-width:440px}
.secret{font-family:var(--f-mono);font-size:12.5px}
.inline-form{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.inline-form .fld{flex:1 1 200px}
.modal-bg{position:fixed;inset:0;background:rgba(30,8,16,.55);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);border-radius:14px;width:min(620px,100%);max-height:calc(100% - 20px);overflow-y:auto;display:flex;flex-direction:column}
.modal header{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 6px}
.modal header h2{font-size:24px;font-weight:700;color:var(--wine)}
.modal form{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 20px 20px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label{font-size:11.5px;font-weight:900;color:var(--muted);letter-spacing:.04em}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.fld textarea{min-height:84px;resize:vertical}
.fld .opts{display:flex;flex-wrap:wrap;gap:6px}
.fld .opts label{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:20px;padding:4px 10px;color:var(--fg);font-weight:400;cursor:pointer;letter-spacing:0;font-size:13px}
.fld .art{max-height:180px;border-radius:8px;align-self:flex-start;border:1px solid var(--line)}
.mfoot{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-top:4px}
.mfoot .sp{flex:1}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:9px;font-weight:700;z-index:60;max-width:calc(100% - 32px)}
.note{font-size:12.5px;color:var(--muted)}
.ro .w{display:none!important}
/* telas públicas: login e aprovação */
body.public .side{display:none}
body.public .app{grid-template-columns:1fr}
body.public .top{display:none}
.solo{max-width:820px;margin:32px auto;display:flex;flex-direction:column;gap:16px;width:100%}
.solo.narrow{max-width:400px;margin-top:8vh}
.solo .logo{width:190px;height:auto;align-self:center}
.solo .post{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:12px}
.solo .post img.art{border-radius:10px;border:1px solid var(--line)}
.solo h1{font-size:32px;font-weight:700;color:var(--wine);line-height:1.1}
.solo h2{font-size:22px;color:var(--wine)}
.solo .legend{white-space:pre-wrap;background:var(--bg);border-radius:10px;padding:14px;overflow-wrap:anywhere}
.solo textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px;width:100%;min-height:96px}
.solo .done{text-align:center;padding:28px 16px}
.solo .links{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.solo .links button{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-weight:700}
/* calendário: cards coloridos por cliente */
.evc{--c:#8A7580;background:color-mix(in srgb,var(--c) 13%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 30%,var(--line));border-left:3px solid var(--c);border-radius:6px;padding:4px 5px;display:flex;flex-direction:column;gap:2px;text-align:left;font-size:11px;cursor:pointer;color:inherit;width:100%;min-width:0}
.evc:hover{border-color:var(--c)}
.evc.publicado{opacity:.6}
.evc-th img,.evc-th video{width:100%;height:52px;object-fit:cover;border-radius:4px;display:block;pointer-events:none}
.evc-t{font-weight:700;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.evc-m{color:var(--muted);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evc-s{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden}
.evc-s i{width:6px;height:6px;border-radius:50%;flex:none}
.more{background:none;border:0;cursor:pointer;text-align:left;padding:0}
/* miniaturas no formulário */
.ths{display:flex;flex-wrap:wrap;gap:8px}
.th{position:relative;width:76px;height:76px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2)}
.th img,.th video{width:100%;height:100%;object-fit:cover;display:block}
.th em{position:absolute;left:4px;bottom:4px;font-style:normal;font-size:10px;font-weight:900;background:var(--wine);color:var(--bg);border-radius:4px;padding:0 5px}
.th button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
.th button .ico{width:13px;height:13px}
/* prévia de celular (imita o app do Instagram, cores fixas de propósito) */
#pv .modal-bg{z-index:56}
.pv-box{background:var(--surface);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;max-height:calc(100% - 20px);overflow-y:auto;width:min(380px,100%)}
.pv-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.pv-head b{display:block;font-family:var(--f-display);font-size:19px;color:var(--wine)}
.pv-head small{color:var(--muted)}
.phone{width:300px;max-width:100%;align-self:center;margin:0 auto;border:9px solid #141018;border-radius:38px;background:#141018;box-shadow:0 18px 40px rgba(40,10,20,.25);overflow:hidden}
.ph-screen{background:#fff;color:#111;border-radius:29px;overflow:hidden;position:relative;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:12.5px;line-height:1.35}
.ph-head{display:flex;align-items:center;gap:8px;padding:30px 10px 8px}
.ph-head b{font-size:12.5px;flex:1}
.ph-av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:11px;flex:none;overflow:hidden;box-shadow:0 0 0 2px #fff,0 0 0 3.5px #d62976}
.ph-av img{width:100%;height:100%;object-fit:cover}
.igi{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ph-mwrap{position:relative}
.ph-media{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;background:#efefef}
.ph-media::-webkit-scrollbar{display:none}
.ph-slide{flex:0 0 100%;scroll-snap-align:start;aspect-ratio:4/5;display:grid;place-items:center;overflow:hidden}
.ph-slide img,.ph-slide video{width:100%;height:100%;object-fit:cover;display:block}
.ph-empty{color:#777;font-size:12px;padding:20px;text-align:center}
.ph-count{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;font-weight:600;border-radius:12px;padding:2px 8px}
.ph-actions{display:flex;align-items:center;gap:12px;padding:9px 10px 4px;position:relative}
.ph-actions .sp{flex:1}
.ph-dots{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:4px}
.ph-dots i{width:6px;height:6px;border-radius:50%;background:#c7c7c7}
.ph-dots i.on{background:#0095f6}
.ph-body{padding:2px 10px 16px;display:flex;flex-direction:column;gap:4px}
.ph-body small{color:#8e8e8e;font-size:10.5px;text-transform:uppercase;letter-spacing:.02em}
.ph-cap{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.ph-cap.open{-webkit-line-clamp:unset;display:block}
.ph-nocap{color:#8e8e8e;cursor:default}
.ph-v{aspect-ratio:9/16;background:#111;color:#fff}
.ph-v .ph-media{height:100%;background:#111}
.ph-v .ph-slide{aspect-ratio:auto;height:100%}
.ph-v .ph-empty{color:#bbb}
.ph-bars{position:absolute;top:12px;left:10px;right:10px;display:flex;gap:3px}
.ph-bars i{flex:1;height:2.5px;border-radius:2px;background:rgba(255,255,255,.4)}
.ph-bars i.on{background:#fff}
.ph-over-top{position:absolute;top:22px;left:10px;right:10px;display:flex;align-items:center;gap:8px;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.ph-over-top small{opacity:.8}
.ph-over-top .ph-av,.ph-user .ph-av{box-shadow:none;width:26px;height:26px}
.ph-over-bottom{position:absolute;left:10px;right:10px;bottom:14px;display:flex;align-items:center;gap:12px}
.ph-reply{flex:1;border:1px solid rgba(255,255,255,.7);border-radius:20px;padding:7px 12px;font-size:12px}
.ph-reel{flex-direction:column;align-items:flex-start;gap:6px;right:52px;text-shadow:0 1px 3px rgba(0,0,0,.6);background:linear-gradient(transparent,rgba(0,0,0,.35));padding-top:20px}
.ph-reel small{display:flex;align-items:center;gap:4px;font-size:11px}
.ph-reel small .igi{width:13px;height:13px}
.ph-user{display:flex;align-items:center;gap:8px}
.ph-follow{border:1px solid rgba(255,255,255,.8);border-radius:6px;padding:1px 8px;font-size:11px;font-weight:600}
.ph-side{position:absolute;right:8px;bottom:22px;display:flex;flex-direction:column;align-items:center;gap:6px;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.ph-side small{font-size:10.5px;margin-top:-4px}
.ph-v .ph-count{top:30px}
.approve-grid{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:start}
@media (max-width:700px){.approve-grid{grid-template-columns:1fr}}

/* conversa por post */
.msgs{display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto;padding:4px 2px}
.msg{display:flex;flex-direction:column;gap:2px;max-width:85%}
.msg.cl{align-self:flex-start}
.msg.eq{align-self:flex-end;align-items:flex-end}
.msg-b{padding:8px 11px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--surface-2)}
.msg.eq .msg-b{background:var(--accent-soft);color:var(--fg)}
.msg small{font-size:11px;color:var(--muted)}
/* grid do feed */
.feed{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;max-width:480px;width:100%}
.fc{position:relative;aspect-ratio:3/4;background:var(--surface-2);overflow:hidden;cursor:pointer;border:0;padding:0;color:inherit}
.fc img,.fc video{width:100%;height:100%;object-fit:cover;display:block}
.fc .ft{display:block;padding:8px;font-size:11px;text-align:left;color:var(--muted)}
.fc .fi{position:absolute;top:5px;right:6px;color:#fff;font-size:13px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.fc .fb{position:absolute;left:4px;right:4px;bottom:4px;font-size:10px;font-weight:700;background:rgba(20,8,14,.72);color:#fff;border-radius:4px;padding:2px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc .fb.late{background:var(--bad)}
.fc:hover{outline:2px solid var(--accent);outline-offset:-2px}
.pthumb{width:44px;height:44px;border-radius:8px;overflow:hidden;background:var(--surface-2);flex:none}
.pthumb img,.pthumb video{width:100%;height:100%;object-fit:cover;display:block}
.tagsug{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;align-items:center}.tagsug .pill{border:0;cursor:pointer}
.fase{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}

/* barras de status */
.sbar{display:flex;height:12px;border-radius:8px;overflow:hidden;background:var(--surface-2)}
.sbar i{display:block;height:100%}
.sleg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted)}
.sleg span{display:inline-flex;align-items:center;gap:6px}
.sleg i{width:8px;height:8px;border-radius:50%;display:inline-block}
.sleg b{color:var(--fg)}
.panel h2 .btn,.panel h2 button{font-family:var(--f-body)}
.row.nova{background:color-mix(in srgb,var(--accent) 6%,transparent)}
/* clientes em cards */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.ccard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:box-shadow .15s,border-color .15s}
.ccard:hover{border-color:var(--muted);box-shadow:0 8px 24px rgba(60,15,30,.08)}
.ccover{height:76px;background:linear-gradient(120deg,color-mix(in srgb,var(--c) 80%,#fff),color-mix(in srgb,var(--c) 30%,#fff 70%))}
.cact{position:absolute;top:8px;right:8px;display:flex;gap:6px;opacity:0;transition:opacity .15s}
.ccard:hover .cact,.ccard:focus-within .cact{opacity:1}
@media (hover:none){.cact{opacity:1}}
.cbtn{width:30px;height:30px;border-radius:8px;border:0;background:rgba(255,255,255,.9);color:#2B0F1A;display:grid;place-items:center;cursor:pointer}
.cbtn .ico{width:15px;height:15px}
.cbody{display:flex;flex-direction:column;gap:6px;padding:0 16px 16px;text-decoration:none;color:inherit}
.cav{width:58px;height:58px;border-radius:14px;margin-top:-30px;border:3px solid var(--surface);display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-weight:800;font-size:21px;overflow:hidden;flex:none}
.cav img{width:100%;height:100%;object-fit:cover}
.cname{display:flex;align-items:center;gap:7px;min-width:0}
.cname i{width:8px;height:8px;border-radius:50%;flex:none}
.cname b{font-family:var(--f-display);font-size:20px;color:var(--wine);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.ccount{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.cn{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border-radius:8px;padding:6px 8px;background:var(--surface-2);color:var(--muted)}
.cn i{width:7px;height:7px;border-radius:50%;flex:none}
.cn.aj{background:var(--bad-soft);color:var(--bad)}
.cn.ap{background:var(--warn-soft);color:var(--warn)}
.cn.ok{background:var(--ok-soft);color:var(--ok)}
/* editor do post */
.editor{display:grid;grid-template-columns:330px minmax(0,1fr);gap:20px;align-items:start}
.ed-left{position:sticky;top:12px;display:flex;flex-direction:column;gap:14px}
.ed-left .phone{width:300px}
.ed-right{display:flex;flex-direction:column;gap:14px;min-width:0}
.egrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.egrid .full{grid-column:1/-1}
.ptabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ptab{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;font-weight:900;color:var(--fg)}
.ptab.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ed-ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ed-ph h2{font-size:20px;color:var(--wine)}
.ed-part textarea{width:100%}
.ed-part .fld input+input{margin-top:6px}
#eSave{font-size:12.5px;color:var(--muted)}
@media (max-width:1000px){.editor{grid-template-columns:1fr}.ed-left{position:static}.ptabs{grid-template-columns:repeat(2,1fr)}}
/* moodboard */
.mood{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.th.mb{width:auto;height:auto;aspect-ratio:1}
/* financeiro */
.stsel{border:0;border-radius:20px;padding:3px 8px;font-size:12px;font-weight:700;cursor:pointer}
.stsel.pago{background:var(--ok-soft);color:var(--ok)}
.stsel.previsto{background:var(--warn-soft);color:var(--warn)}
.stsel.atraso{background:var(--bad-soft);color:var(--bad)}
/* portal */
.solo.wide{max-width:1040px}
.ph-av.big{width:56px;height:56px;font-size:19px}
.pcab{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pcnt{display:flex;flex-direction:column;align-items:center;min-width:72px}
.pcnt b{font-family:var(--f-display);font-size:24px;line-height:1}
.pcnt small{font-size:11px;color:var(--muted)}
.pmonth{min-width:640px}
.pmonth .day{min-height:96px}
a.evc{color:inherit}
.brand-custom{display:inline-block;background:#fff;border-radius:10px;padding:6px 10px}
.brand-custom img{max-height:44px;width:auto}

@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .side{flex-direction:row;align-items:center;gap:10px;padding:10px max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));overflow-x:auto;overflow-y:hidden}
  .brand{padding:0 4px}
  .brand img{width:74px}
  .nav{flex-direction:row}
  .nav-group,.me{display:none}
  .top,#view{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .top h1{font-size:28px}
  .modal form{grid-template-columns:1fr}
  .day{min-height:64px;padding:4px}
  .day .ev{font-size:0;height:6px;padding:0;border-left-width:0}
  .day .evc{height:6px;padding:0;border:0;background:var(--c)}.day .evc>*{display:none}
  .solo .phone{width:280px}
  .col{max-height:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>


<div class="app" id="app">
  <aside class="side" id="side"></aside>
  <main>
    <header class="top" id="top"></header>
    <div id="view"></div>
  </main>
</div>
<div id="modal" hidden></div>
<div id="pv" hidden></div>
<div id="toast" class="toast" hidden></div>

function errMsg(e){

async function claudeStore(){
  const c=window.claude;
  const st={kind:'claude',ok:false,me:null,isAdmin:false,canWrite:false,canUpload:false};
  st.artUrl=id=>'/_blob/'+id;
  st.approvalLink=id=>geral.url?geral.url.replace(/#.*$/,'')+'#aprovar-'+id:'';
  if(!c||!c.use)return st;
  const[u,d,a]=await Promise.all([c.use('user'),c.use('db'),c.use('assets')]);
  if(!d)return st;
  st.ok=true;st.canUpload=!!a;st.canWrite=true;
  if(u){const m=await u.me();st.me={name:m.name||'Você',avatar:m.avatarUrl};st.isAdmin=await u.canEdit();const w=await u.can('data.write');st.canWrite=w!==false}
  st.watch=(coll,cb,err)=>d.collection(coll).onSnapshot(s=>{const o={};s.docs.forEach(x=>o[x.id]={id:x.id,...x.data()});cb(o,!s.metadata.fromCache)},err);
  st.watchDoc=(coll,id,cb)=>d.doc(coll+'/'+id).onSnapshot(s=>cb(s.exists?s.data():null),()=>{});
  st.set=(coll,id,data)=>d.collection(coll).doc(id).set(data);
  st.update=(coll,id,data)=>d.collection(coll).doc(id).update(data);
  st.del=(coll,id)=>d.collection(coll).doc(id).delete();
  st.upload=async f=>(await a.upload(f)).id;
  st.respondPublic=(id,status,com)=>responder(id,status,com,'cliente');
  st.respondParte=(id,parte,status,com)=>{const t=S.tarefas[id];if(!t)return false;return patch('tarefas',id,respostaParte(t,parte,status,com,'cliente'))};
  st.commentPublic=(id,nome,texto)=>{const t=S.tarefas[id];if(!t)return false;return patch('tarefas',id,{conversa:(t.conversa||[]).concat([{k:uid(),autor:'cliente',nome,texto,em:Date.now()}])})};
  return st;
}

/* ---------- camada de dados: Supabase (site próprio) ---------- */
function supaStore(){
  const cfg=window.CLIK_CONFIG;
  const sb=window.supabase.createClient(cfg.url,cfg.anonKey,{auth:{persistSession:true,detectSessionInUrl:true,flowType:'implicit'}});
  const st={kind:'supa',ok:false,sb,cache:{},subs:{},loading:{}};
  const mapErr=e=>({code:e&&(e.code==='42501'||/row-level security/i.test(e.message||''))?'invalid_argument':'unavailable',message:e&&e.message});
  st.artUrl=id=>id.includes('/')?sb.storage.from('artes').getPublicUrl(id).data.publicUrl:'';
  st.approvalLink=id=>location.origin+location.pathname+'#aprovar-'+id;
  st.init=async session=>{
    const{data,error}=await sb.from('membros').select('agencia_id,papel').eq('user_id',session.user.id).limit(1);
    if(error||!data||!data.length)return false;
    st.ag=data[0].agencia_id;st.papel=data[0].papel;st.ok=true;
    st.isAdmin=st.papel==='admin';st.canWrite=st.papel!=='viewer';st.canUpload=st.canWrite;
    st.me={name:session.user.email,avatar:''};
    sb.channel('reg-'+st.ag).on('postgres_changes',{event:'*',schema:'public',table:'registros',filter:'agencia_id=eq.'+st.ag},p=>st._ev(p)).subscribe();
    return true;
  };
  st._ev=p=>{
    if(p.eventType==='DELETE'){const o=p.old||{};if(o.agencia_id&&o.agencia_id!==st.ag)return;if(o.colecao&&st.cache[o.colecao]){delete st.cache[o.colecao][o.id];st._emit(o.colecao)}return}
    const r=p.new;if(!r||!r.colecao)return;(st.cache[r.colecao]=st.cache[r.colecao]||{})[r.id]={id:r.id,...r.dados};st._emit(r.colecao);
  };
  st._emit=c=>(st.subs[c]||[]).forEach(cb=>cb({...(st.cache[c]||{})},true));
  st._load=async coll=>{
    if(st.loading[coll])return st.loading[coll];
    st.loading[coll]=(async()=>{let all=[],from=0;
      for(;;){const{data,error}=await sb.from('registros').select('id,dados').eq('agencia_id',st.ag).eq('colecao',coll).range(from,from+999);if(error)throw mapErr(error);all=all.concat(data);if(data.length<1000)break;from+=1000}
      const o={};all.forEach(r=>o[r.id]={id:r.id,...r.dados});st.cache[coll]=o;st._emit(coll)})();
    try{await st.loading[coll]}finally{st.loading[coll]=null}
  };
  st.watch=(coll,cb,err)=>{(st.subs[coll]=st.subs[coll]||[]).push(cb);if(st.cache[coll])cb({...st.cache[coll]},true);else st._load(coll).catch(e=>err&&err(e));return()=>{}};
  st.watchDoc=(coll,id,cb)=>st.watch(coll,o=>cb(o[id]?clean(o[id]):null),()=>cb(null));
  st.set=async(coll,id,dados)=>{const{error}=await sb.from('registros').upsert({agencia_id:st.ag,colecao:coll,id,dados,atualizado_em:new Date().toISOString()});if(error)throw mapErr(error);(st.cache[coll]=st.cache[coll]||{})[id]={id,...dados};st._emit(coll)};
  st.update=async(coll,id,partial)=>{const cur=st.cache[coll]&&st.cache[coll][id];if(!cur)throw{code:'invalid_argument'};return st.set(coll,id,deepMerge(clean(cur),partial))};
  st.del=async(coll,id)=>{const{error}=await sb.from('registros').delete().match({agencia_id:st.ag,colecao:coll,id});if(error)throw mapErr(error);if(st.cache[coll]){delete st.cache[coll][id];st._emit(coll)}};
  st.upload=async f=>{const ext=((f.name||'').split('.').pop()||'png').toLowerCase().replace(/[^a-z0-9]/g,'')||'png';const path=st.ag+'/'+uid()+'.'+ext;const{error}=await sb.storage.from('artes').upload(path,f,{contentType:f.type||undefined});if(error)throw error;return path};
  st.commentPublic=async(id,nome,texto)=>{const{data,error}=await sb.rpc('comentar_tarefa',{p_id:id,p_nome:nome,p_texto:texto});if(error||!data)return false;const t=S.tarefas[id];if(t)S.tarefas[id]={...t,conversa:(t.conversa||[]).concat([{k:uid(),autor:'cliente',nome,texto,em:Date.now()}])};return true};
  st.respondParte=async(id,parte,status,com)=>{const t=S.tarefas[id];if(!t)return false;const r=respostaParte(t,parte,status,com,'cliente');
    const{data,error}=await sb.rpc('responder_parte',{p_id:id,p_parte:parte,p_status:status,p_comentario:com||'',p_etapa:r.etapa});if(error||!data)return false;S.tarefas[id]={...t,...r};return true};
  st.portalGet=async token=>{const{data,error}=await sb.rpc('portal_cliente',{p_token:token});if(error)throw error;return data};
  st.publicGet=async id=>{const{data,error}=await sb.rpc('ver_aprovacao',{p_id:id});if(error)throw error;return data};
  st.respondPublic=async(id,status,com)=>{const{data,error}=await sb.rpc('responder_aprovacao',{p_id:id,p_status:status,p_comentario:com||''});if(error)return false;if(data&&S.tarefas[id])S.tarefas[id]={...S.tarefas[id],aprovacao:{...(S.tarefas[id].aprovacao||{}),status,comentario:com||''}};return !!data};
  st.members=async()=>{const{data,error}=await sb.rpc('listar_membros',{p_agencia:st.ag});if(error)throw error;return data||[]};
  st.addMember=async(email,papel)=>{const{data,error}=await sb.rpc('adicionar_membro',{p_agencia:st.ag,p_email:email,p_papel:papel});if(error)throw error;return data};
  st.removeMember=async uidm=>{const{error}=await sb.rpc('remover_membro',{p_agencia:st.ag,p_user:uidm});if(error)throw error};
  return st;
}

const igi=(n,fill)=>`<svg viewBox="0 0 24 24" class="igi" ${fill?'style="fill:currentColor"':''} aria-hidden="true">${IG[n]}</svg>`;
function phone(t){
  const c=cli(t.clienteId)||{};

  if(story)return `<div class="phone"><div class="ph-screen ph-v"><div class="ph-media" data-car>${slides}</div><div class="ph-bars">${(arts.length?arts:[0]).map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</div><div class="ph-over-top">${av}<b>${esc(user)}</b><small>agora</small></div><div class="ph-over-bottom"><span class="ph-reply">Enviar mensagem</span>${igi('heart')}${igi('send')}</div></div></div>`;

/* ---------- v3: status, partes do post, clientes, painel, financeiro, configurações, portal ---------- */
const PARTES=[['tema','Tema'],['conteudo','Conteúdo'],['midia','Mídia'],['legenda','Legenda']];
const PARTE_ETAPA={tema:'briefing',conteudo:'copy',midia:'producao',legenda:'copy'};
const PST={rascunho:['Rascunho',''],aprovacao:['Em aprovação','warn'],ajuste:['Ajuste','bad'],aprovado:['Aprovado','ok']};
const partSt=(t,k)=>((t.partes||{})[k]||{}).st||'rascunho';
const pstPill=st=>`<span class="pill ${PST[st][1]}">${PST[st][0]}</span>`;
const ehPartes=t=>!!(t.aprovacao&&t.aprovacao.fase==='partes');
function etapaPorPartes(p,atual){
  const s=k=>(p[k]||{}).st||'rascunho',ks=PARTES.map(x=>x[0]);
  const aj=ks.find(k=>s(k)==='ajuste');if(aj)return PARTE_ETAPA[aj];
  if(ks.some(k=>s(k)==='aprovacao'))return 'cliente';
  for(let i=0;i<ks.length;i++){const k=ks[i];if(s(k)==='aprovado')continue;if(ks.slice(i+1).some(j=>s(j)==='aprovado'))continue;return PARTE_ETAPA[k]}
  return atual==='publicado'?'publicado':'agendado';
}
function resumoPartes(p){const v=PARTES.map(([k])=>(p[k]||{}).st||'rascunho');if(v.includes('ajuste'))return 'ajuste';if(v.includes('aprovacao'))return 'pendente';if(v.includes('aprovado'))return 'aprovado';return null}
function respostaParte(t,parte,st,com,por){
  const partes=deepMerge(t.partes||{},{[parte]:{st,com:com||'',em:Date.now(),por}});
  const res=resumoPartes(partes);
  return{partes,etapa:etapaPorPartes(partes,t.etapa),aprovacao:{status:res||'pendente',comentario:st==='ajuste'?com||'':((t.aprovacao||{}).comentario||''),em:Date.now(),por,fase:'partes'}};
}
const stAprov=t=>{const s=t.aprovacao&&t.aprovacao.status;if(s==='pendente')return 'aprovacao';if(s==='ajuste')return 'ajuste';if(s==='aprovado'||['agendado','publicado'].includes(t.etapa))return 'aprovado';return 'rascunho'};
const stVeic=t=>t.etapa==='publicado'?'publicado':t.etapa==='agendado'?'programado':'nao';
function stackBar(itens){
  const tot=itens.reduce((s,i)=>s+i[1],0)||1;
  return `<div class="sbar">${itens.map(([l,n,c])=>n?`<i style="width:${n/tot*100}%;background:${c}" title="${l}: ${n}"></i>`:'').join('')}</div><div class="sleg">${itens.map(([l,n,c])=>`<span><i style="background:${c}"></i>${l} <b>${n}</b></span>`).join('')}</div>`;
}

/* ----- painel ----- */
const ATV={aba:'tudo'};
function eventosAtividade(){
  const ev=[];
  list('tarefas').forEach(t=>{const lido=t.lidoEm||0;const a=t.aprovacao;
    if(a&&a.por==='cliente'&&a.em&&a.status!=='pendente'&&a.fase!=='partes')ev.push({em:a.em,t,tipo:a.status,nova:a.em>lido});
    Object.entries(t.partes||{}).forEach(([k,p])=>{if(p&&p.por==='cliente'&&p.em&&['aprovado','ajuste'].includes(p.st))ev.push({em:p.em,t,tipo:p.st,parte:k,com:p.com,nova:p.em>lido})});
    (t.conversa||[]).forEach(m=>{if(m.autor==='cliente')ev.push({em:m.em,t,tipo:'msg',m,nova:(m.em||0)>lido})})});
  return ev.sort((a,b)=>b.em-a.em);
}
function atividade(){
  const all=eventosAtividade();const nl=all.filter(e=>e.nova).length;
  const ev=(ATV.aba==='nao'?all.filter(e=>e.nova):all).slice(0,10);
  const nomeParte=k=>(PARTES.find(p=>p[0]===k)||['',''])[1];
  const rows=ev.map(e=>`<button class="row ${e.nova?'nova':''}" data-act="edit-task" data-id="${e.t.id}"><span class="dot" style="background:${esc(cliCor(e.t.clienteId))}"></span><span class="main"><b>${e.tipo==='msg'?`${esc(e.m.nome||'Cliente')} comentou`:e.tipo==='aprovado'?'Cliente aprovou':'Cliente pediu ajuste'}${e.parte?' ['+esc(nomeParte(e.parte))+']':''}: ${esc(e.t.titulo)}</b><small style="display:block;white-space:normal">${e.tipo==='msg'?'"'+esc(e.m.texto)+'"':e.com?'"'+esc(e.com)+'"':esc(cliLabel(e.t))}</small></span>${e.nova?'<span class="pill accent">Nova</span>':e.tipo==='aprovado'?'<span class="pill ok">Aprovado</span>':e.tipo==='ajuste'?'<span class="pill bad">Ajuste</span>':''}<span class="meta">${diasDesde(e.em)}</span></button>`).join('');
  return `<section class="panel"><h2>Atividade recente ${nl?`<button class="btn ghost sm" data-act="atv-lidas" style="margin-left:auto">Marcar todas como lidas</button>`:''}</h2>
    <div class="seg" style="align-self:flex-start"><button data-act="atv-aba" data-a="tudo" class="${ATV.aba==='tudo'?'on':''}">Tudo <span class="pill">${all.length}</span></button><button data-act="atv-aba" data-a="nao" class="${ATV.aba==='nao'?'on':''}">Não lidas <span class="pill ${nl?'accent':''}">${nl}</span></button></div>
    <div class="rows">${rows||emptyMsg(ATV.aba==='nao'?'Tudo lido.':'Aprovações, pedidos de ajuste e mensagens dos clientes aparecem aqui.')}</div></section>`;
}
function statusConteudos(){
  const t=list('tarefas');const a={rascunho:0,aprovacao:0,ajuste:0,aprovado:0};t.filter(x=>x.etapa!=='publicado').forEach(x=>a[stAprov(x)]++);
  const v={nao:0,programado:0,publicado:0};t.forEach(x=>v[stVeic(x)]++);

  else{

    body=`<form class="post" id="authForm" data-mode="${v}"><h2>${titulos[v]}</h2>${msg}
      <div class="fld"><label for="aEmail">E-mail</label><input id="aEmail" type="email" autocomplete="email" required value="${esc(AUTH.email)}"></div>
      ${v!=='recuperar'?`<div class="fld"><label for="aSenha">Senha</label><input id="aSenha" type="password" autocomplete="${v==='criar'?'new-password':'current-password'}" minlength="${v==='criar'?8:1}" required></div>`:''}
      <button class="btn primary" type="submit">${v==='entrar'?'Entrar':v==='criar'?'Criar conta':'Enviar link de recuperação'}</button>
      <div class="links">${v==='entrar'?`<button type="button" data-act="auth-view" data-v="criar">Criar conta</button><button type="button" data-act="auth-view" data-v="recuperar">Esqueci a senha</button>`:`<button type="button" data-act="auth-view" data-v="entrar">Voltar para o login</button>`}</div></form>`;
  }
  return `<div class="solo narrow">${logoImg('logo')}${body}</div>`;
}
async function authSubmit(form){
  const sb=STORE.sb,mode=form.dataset.mode;
  const email=($('#aEmail')||{}).value,senha=($('#aSenha')||{}).value;
  const btn=form.querySelector('[type=submit]');btn.disabled=true;AUTH.email=email||AUTH.email;
  const back=window.location.origin+window.location.pathname;
  try{
    if(mode==='entrar'){const{data,error}=await sb.auth.signInWithPassword({email,password:senha});if(error)throw error;AUTH.msg='';await boot(data.session);return}
    if(mode==='criar'){const{data,error}=await sb.auth.signUp({email,password:senha,options:{emailRedirectTo:back}});if(error)throw error;
      if(data.session){await boot(data.session);return}
      AUTH.view='entrar';AUTH.msg='Conta criada. Confirme pelo link que enviamos para o seu e-mail e depois entre aqui.'}
    if(mode==='recuperar'){const{error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:back});if(error)throw error;AUTH.view='entrar';AUTH.msg='Se o e-mail estiver cadastrado, você vai receber um link para criar uma nova senha.'}
    if(mode==='novaSenha'){const{data,error}=await sb.auth.updateUser({password:senha});if(error)throw error;AUTH.msg='';const s=(await sb.auth.getSession()).data.session;await boot(s);return}
  }catch(e){
    const m=String(e&&e.message||'');
    AUTH.msg=/Invalid login/i.test(m)?'E-mail ou senha incorretos.':/not confirmed/i.test(m)?'Confirme seu e-mail pelo link enviado antes de entrar.':/already registered/i.test(m)?'Este e-mail já tem conta. Use Entrar.':/Password should/i.test(m)?'A senha precisa ter pelo menos 8 caracteres.':'Não deu certo. Confira os dados e tente de novo.';
  }
  render();
}

  if(s==='aprovado')return '<span class="pill ok">Aprovado</span>';

function card(t){
  const atras=t.data&&t.data<today()&&!['publicado','agendado'].includes(t.etapa);
  const cp=capa(t);const na=artesDe(t).length;const art=cp&&midiaUrl(cp)?`<span style="position:relative;display:block">${midia(cp,1)}${na>1?`<span class="pill" style="position:absolute;top:5px;right:5px">${na} mídias</span>`:''}</span>`:'';
  return `<div class="card" draggable="${canWrite}" data-drag="tarefas:${t.id}" data-act="edit-task" data-id="${t.id}" tabindex="0">
    ${art}<span class="chip"><span class="dot" style="background:${esc(cliCor(t.clienteId))}"></span>${cliLabel(t)}</span>
    <span class="t">${esc(t.titulo)}</span>
    <span class="l"><span>${esc(t.formato||'')}${redesDe(t).length?' · '+esc(redesTxt(t)):''}</span>${t.data?`<span style="${atras?'color:var(--bad);font-weight:900':''}">${fdate(t.data)}</span>`:''}${membroNome(t.responsavel)?`<span>· ${esc(membroNome(t.responsavel))}</span>`:''}${apPill(t)}${naoLidas(t)?`<span class="pill accent">${naoLidas(t)} msg nova${naoLidas(t)>1?'s':''}</span>`:''}</span>${tagsDe(t).length?`<span class="l">${tagsDe(t).map(g=>`<span class="pill">${esc(g)}</span>`).join('')}</span>`:''}
  </div>`;
}
function kpi(label,val,sub,cls){return `<div class="kpi ${cls||''}"><span>${label}</span><b>${val}</b>${sub?`<small>${sub}</small>`:''}</div>`}
function emptyMsg(txt){return `<p class="empty">${txt}</p>`}
function diasDesde(ts){if(!ts)return '';const d=Math.floor((Date.now()-ts)/864e5);return d<=0?'hoje':d===1?'há 1 dia':`há ${d} dias`}

/* ---------- PAINEL ---------- */
function vPainel(){
  const t=list('tarefas'),h=today();
  const abertas=t.filter(x=>x.etapa!=='publicado');
  const aguard=t.filter(x=>x.aprovacao&&x.aprovacao.status==='pendente');
  const ajustes=t.filter(x=>x.aprovacao&&x.aprovacao.status==='ajuste'&&x.etapa!=='publicado');
  const atras=abertas.filter(x=>x.data&&x.data<h&&x.etapa!=='agendado');
  const ativos=list('clientes').filter(c=>(c.status||'ativo')==='ativo');
  const prox=t.filter(x=>x.data&&x.data>=h&&x.data<=addDays(h,7)&&x.etapa!=='publicado').sort(byData);
  const pauta=list('pauta').filter(p=>p.status!=='resolvida').sort(byData).slice(0,6);
  let fin='';
  if(isAdmin){
    const m=h.slice(0,7);const lm=list('financeiro').filter(f=>(f.data||'').startsWith(m));
    const rec=lm.filter(f=>f.tipo==='receita').reduce((s,f)=>s+(+f.valor||0),0);
    const des=lm.filter(f=>f.tipo==='despesa').reduce((s,f)=>s+(+f.valor||0),0);
    fin=kpi('Resultado do mês',brl(rec-des),`${brl(rec)} entra · ${brl(des)} sai`,rec-des>=0?'good':'alert');
  }
  const carga=ativos.map(c=>({c,n:abertas.filter(x=>x.clienteId===c.id).length})).sort((a,b)=>b.n-a.n);
  const maxC=Math.max(1,...carga.map(x=>x.n));
  return `<div class="kpis">
    ${kpi('Clientes ativos',ativos.length,`${list('prospects').filter(p=>!['fechado','perdido'].includes(p.etapa)).length} leads em negociação`)}
    ${kpi('Em produção',abertas.length,`${prox.length} para os próximos 7 dias`)}
    ${kpi('Com o cliente',aguard.length,`${ajustes.length} voltaram com ajuste`,ajustes.length?'alert':'')}
    ${kpi('Atrasados',atras.length,atras.length?'Data de publicação já passou':'Nada atrasado',atras.length?'alert':'good')}
    ${fin}
  </div>
  ${statusConteudos()}
  ${atividade()}
  <div class="grid2">
    <section class="panel"><h2>Próximos 7 dias <span class="pill">${prox.length}</span></h2><div class="rows">${prox.map(x=>taskRow(x)).join('')||emptyMsg('Nenhuma publicação prevista para a semana. Crie um conteúdo com data para ele aparecer aqui.')}</div></section>
    <section class="panel"><h2>Precisa de atenção</h2><div class="rows">${[...ajustes,...atras.filter(x=>!ajustes.includes(x))].map(x=>taskRow(x)).join('')||emptyMsg('Nenhum ajuste pendente e nada atrasado.')}</div></section>
    <section class="panel"><h2>Aguardando aprovação <span class="pill warn">${aguard.length}</span></h2><div class="rows">${aguard.sort(byData).map(x=>taskRow(x,`<span class="pill">${diasDesde(x.aprovacao.em)}</span>`)).join('')||emptyMsg('Nada parado com cliente.')}</div></section>
    <section class="panel"><h2>Tráfego com alerta <a class="pill" href="#impulsionamentos" style="margin-left:auto;text-decoration:none">Ver campanhas</a></h2><div class="rows">${list('impulsionamentos').filter(x=>['rodando','pausado'].includes(trSt(x))).map(x=>({x,a:alertasReais(x)})).filter(o=>o.a.length).map(({x,a})=>`<a class="row" href="#campanha-${x.id}" style="text-decoration:none"><span class="dot" style="background:${esc(cliCor(x.clienteId))}"></span><span class="main"><b>${esc(x.campanha)}</b><small style="display:block;white-space:normal">${esc(a[0][1])}</small></span><span class="pill ${a.some(q=>q[0]==='bad')?'bad':'warn'}">${a.length}</span></a>`).join('')||emptyMsg('Nenhuma campanha rodando com alerta.')}</div></section>
    <section class="panel"><h2>Pauta interna <a class="pill" href="#pauta" style="margin-left:auto;text-decoration:none">Ver tudo</a></h2><div class="rows">${pauta.map(pautaRow).join('')||emptyMsg('Sem assuntos em aberto.')}</div></section>
  </div>
  <section class="panel"><h2>Conteúdos em aberto por cliente</h2><div class="rows">${carga.map(({c,n})=>`<a class="row" href="#cliente-${c.id}" style="text-decoration:none"><span class="dot" style="background:${esc(c.cor||'#888')}"></span><span class="main" style="flex:0 0 190px"><b>${esc(c.nome)}</b></span><span style="flex:1" class="bar"><i style="width:${n/maxC*100}%;background:${esc(c.cor||'var(--accent)')}"></i></span><span class="meta">${n}</span></a>`).join('')||emptyMsg('Cadastre seus clientes para ver a distribuição.')}</div></section>`;
}

/* ---------- PRODUÇÃO (kanban) ---------- */
function vConteudo(){
  let t=list('tarefas');
  if(F.cli)t=t.filter(x=>x.clienteId===F.cli);
  if(F.resp)t=t.filter(x=>x.responsavel===F.resp);
  const todasTags=[...new Set(list('tarefas').flatMap(tagsDe))].sort();
  if(PROD.tag)t=t.filter(x=>tagsDe(x).includes(PROD.tag));
  if(PROD.rede)t=t.filter(x=>redesDe(x).includes(PROD.rede));
  const filtros=`<div class="filters"><div class="seg">${[['kanban','Kanban'],['lista','Lista']].map(([k,l])=>`<button data-act="prod-view" data-v="${k}" class="${PROD.view===k?'on':''}">${l}</button>`).join('')}</div><select class="f" data-filter="cli" aria-label="Filtrar por cliente">${opts([['','Todos os clientes'],...cliOpts().slice(1)],F.cli)}</select><select class="f" data-filter="resp" aria-label="Filtrar por responsável">${opts([['','Toda a equipe'],...eqOpts().slice(1)],F.resp)}</select><select class="f" data-filter="rede" aria-label="Filtrar por rede">${opts([['','Todas as redes'],...REDES],PROD.rede)}</select>${todasTags.length?`<select class="f" data-filter="tag" aria-label="Filtrar por tag">${opts([['','Todas as tags'],...todasTags],PROD.tag)}</select>`:''}</div>`;
  if(PROD.view==='lista')return filtros+listaProducao(t);
  const cols=ETAPAS.map(([k,l])=>{const it=t.filter(x=>(x.etapa||'briefing')===k).sort(byData);
    return `<section class="col" data-drop="tarefas:${k}"><header><span>${l}</span><b>${it.length}</b></header><div class="col-body">${it.map(card).join('')||'<p class="empty-col">Nenhum card</p>'}</div></section>`}).join('');
  return filtros+`<div class="kanban" data-keep="kanban">${cols}</div>`;
}

/* ---------- CALENDÁRIO ---------- */
function vCalendario(){
  if(!CAL.ref)CAL.ref=today();
  let t=list('tarefas').filter(x=>x.data);
  if(F.cli)t=t.filter(x=>x.clienteId===F.cli);
  const by={};t.forEach(x=>(by[x.data]=by[x.data]||[]).push(x));
  const ev=x=>{const cp=capa(x);return `<button class="evc ${x.etapa==='publicado'?'publicado':''}" style="--c:${esc(cliCor(x.clienteId))}" data-act="edit-task" data-id="${x.id}" title="${esc(cliNome(x.clienteId)+' · '+x.titulo)}">${cp&&midiaUrl(cp)?`<span class="evc-th">${midia(cp,1)}</span>`:''}<span class="evc-t">${esc(x.titulo)}</span><span class="evc-m">${cliLabel(x)}</span><span class="evc-s"><i style="background:${ETAPA_COR[x.etapa||'briefing']}"></i>${etapaNome(x.etapa)}</span></button>`};
  const r=pd(CAL.ref);let titulo='',body='';
  if(CAL.mode==='mes'){
    titulo=MESES_L[r.getMonth()]+' '+r.getFullYear();
    const first=new Date(r.getFullYear(),r.getMonth(),1,12);const off=(first.getDay()+6)%7;
    const start=new Date(first);start.setDate(1-off);
    const last=new Date(r.getFullYear(),r.getMonth()+1,0,12);const cells=Math.ceil((off+last.getDate())/7)*7;
    let g=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(d=>`<div class="wd">${d}</div>`).join('');
    for(let i=0;i<cells;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=ymd(d);const it=(by[k]||[]);
      g+=`<div class="day ${d.getMonth()!==r.getMonth()?'out':''} ${k===today()?'today':''}" data-act="day" data-d="${k}"><span class="n">${d.getDate()}</span>${it.slice(0,2).map(ev).join('')}${it.length>2?`<span class="more">+${it.length-2} mais</span>`:''}</div>`}
    body=`<div class="month">${g}</div>`;
  }else if(CAL.mode==='semana'){
    const off=(r.getDay()+6)%7;const s=addDays(CAL.ref,-off);
    titulo='Semana de '+fdate(s)+' a '+fdate(addDays(s,6));
    body=`<div class="week" data-keep="week">${[0,1,2,3,4,5,6].map(i=>{const k=addDays(s,i);const d=pd(k);return `<div class="wcol ${k===today()?'today':''}"><h3>${['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'][d.getDay()]} ${fdate(k)}</h3>${(by[k]||[]).map(ev).join('')}<button class="btn ghost sm w" data-act="new-task" data-d="${k}">${ic('plus')}Adicionar</button></div>`}).join('')}</div>`;
  }else{
    titulo=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'][r.getDay()]+', '+fdateL(CAL.ref);
    body=`<section class="panel"><div class="rows">${(by[CAL.ref]||[]).map(x=>taskRow(x)).join('')||emptyMsg('Nada previsto para este dia.')}</div><button class="btn w" data-act="new-task" data-d="${CAL.ref}" style="align-self:flex-start">${ic('plus')}Conteúdo neste dia</button></section>`;
  }
  return `<div class="cal-head"><button class="btn sm" data-act="cal-prev" aria-label="Anterior">${ic('left')}</button><button class="btn sm" data-act="cal-hoje">Hoje</button><button class="btn sm" data-act="cal-next" aria-label="Próximo">${ic('right')}</button><h2>${titulo}</h2><span style="flex:1"></span>
    <select class="f" data-filter="cli" aria-label="Filtrar por cliente">${opts([['','Todos os clientes'],...cliOpts().slice(1)],F.cli)}</select>
    <div class="seg">${[['mes','Mês'],['semana','Semana'],['dia','Dia']].map(([k,l])=>`<button data-act="cal-mode" data-m="${k}" class="${CAL.mode===k?'on':''}">${l}</button>`).join('')}</div></div>${body}`;
}

/* ---------- APROVAÇÕES ---------- */
function apLink(id){return STORE?STORE.approvalLink(id):''}
function apMsg(t){
  if(ehPartes(t))return apMsgPartes(t);
  const c=cli(t.clienteId);const link=apLink(t.id);
  const fs=faseDe(t);
  return `Olá${c&&c.contato?', '+c.contato:''}! Segue ${fs==='ideia'?'a ideia do conteúdo':fs==='texto'?'o texto do conteúdo':'o conteúdo'} para sua aprovação:\n\n*${t.titulo}*\n${t.marca?t.marca+' · ':''}${t.formato||''}${redesDe(t).length?' · '+redesTxt(t):''}${t.data?'\nPublicação prevista: '+fdateL(t.data):''}${t.legenda?'\n\nLegenda:\n'+t.legenda:''}${t.linkArte?'\n\nArte: '+t.linkArte:''}\n\n${link?'Para aprovar ou pedir ajuste, é só abrir: '+link:'Responda APROVADO ou mande os ajustes por aqui.'}`;
}
function vAprovacoes(){
  const t=list('tarefas');
  const pend=t.filter(x=>x.aprovacao&&x.aprovacao.status==='pendente').sort(byData);
  const aj=t.filter(x=>x.aprovacao&&x.aprovacao.status==='ajuste'&&x.etapa!=='publicado').sort(byData);
  const ok=t.filter(x=>x.aprovacao&&x.aprovacao.status==='aprovado').sort((a,b)=>(b.aprovacao.em||0)-(a.aprovacao.em||0)).slice(0,12);
  const hasLink=!!apLink('x');
  const acts=x=>`<span class="actions"><button class="btn sm" data-act="pv-open" data-id="${x.id}">Prévia</button><button class="btn sm" data-act="ap-wpp" data-id="${x.id}">${ic('copy')}Mensagem</button>${hasLink?`<button class="btn sm" data-act="ap-link" data-id="${x.id}">${ic('link')}Link</button>`:''}<button class="btn sm w" data-act="ap-reg" data-id="${x.id}">Registrar resposta</button></span>`;
  const item=(x,extra)=>`<div class="row" style="cursor:default;flex-wrap:wrap"><span class="dot" style="background:${esc(cliCor(x.clienteId))}"></span><button class="main" data-act="edit-task" data-id="${x.id}" style="background:none;border:0;text-align:left;cursor:pointer;padding:0;color:inherit"><b>${esc(x.titulo)}</b><small>${esc(FASES[faseDe(x)].nome)} · ${cliLabel(x)} · ${esc(x.formato||'')}${x.data?' · publica '+fdateL(x.data):''}</small>${naoLidas(x)?`<small style="display:block;color:var(--accent);font-weight:700">${naoLidas(x)} mensagem nova do cliente</small>`:''}${extra||''}</button>${acts(x)}</div>`;
  const dica=MODE==='supa'?'O link abre uma página onde o cliente vê a arte e aprova ou pede ajuste, sem precisar de login.':'O link abre a página de aprovação para quem tem acesso à Central.';
  return `<div class="banner">Envie a mensagem pronta no WhatsApp do cliente. ${dica} Se o cliente responder direto pelo WhatsApp, use <b>Registrar resposta</b> para o card andar sozinho no kanban.</div>
  <section class="panel"><h2>Com o cliente <span class="pill warn">${pend.length}</span></h2><div class="rows">${pend.map(x=>item(x,`<small style="display:block;color:var(--warn)">Enviado ${diasDesde(x.aprovacao.em)}</small>`)).join('')||emptyMsg('Nenhum conteúdo esperando o cliente. Mova um card para "Aguardando cliente" na Produção.')}</div></section>
  <section class="panel"><h2>Ajustes pedidos <span class="pill bad">${aj.length}</span></h2><div class="rows">${aj.map(x=>item(x,x.aprovacao.comentario?`<small style="display:block;color:var(--bad);white-space:normal">"${esc(x.aprovacao.comentario)}"</small>`:'')).join('')||emptyMsg('Nenhum ajuste em aberto.')}</div></section>
  <section class="panel"><h2>Aprovados recentemente</h2><div class="rows">${ok.map(x=>taskRow(x)).join('')||emptyMsg('As aprovações aparecem aqui.')}</div></section>`;
}
function vAprovar(id){
  const t=S.tarefas[id];
  const head=(AP.back?`<a href="#${AP.back}" style="align-self:flex-start;color:var(--muted)">← Voltar para o portal</a>`:'')+logoImg('logo');
  if(!t){
    const carregando=!dbReady||AP.loading||(MODE==='claude'&&ready()&&!loaded.has('tarefas'));
    const msg=carregando?'Carregando conteúdo…':(MODE==='claude'&&!ready())?'Para ver este conteúdo, abra o link logado com o acesso enviado pela Clik.':'Conteúdo não encontrado. Ele pode ter sido removido. Fale com a equipe da Clik pelo WhatsApp.';
    return `<div class="solo">${head}<div class="post"><p>${msg}</p></div></div>`;
  }
  if(ehPartes(t))return vAprovarPartes(t,head);
  const st=t.aprovacao&&t.aprovacao.status;
  const linkArte=t.linkArte?`<a class="btn" style="align-self:flex-start" href="${esc(t.linkArte)}" target="_blank" rel="noopener">${ic('link')}Abrir arte ou vídeo</a>`:'';
  let resp='';
  if(AP.done===id||st==='aprovado'||st==='ajuste'){
    resp=st==='aprovado'?`<div class="post done"><h2>${faseDe(t)==='ideia'?'Ideia aprovada':faseDe(t)==='texto'?'Texto aprovado':'Conteúdo aprovado'}</h2><p class="note">Obrigado! A equipe da Clik já foi avisada e vai seguir com a publicação.</p></div>`:`<div class="post done"><h2>Ajuste enviado</h2><p class="note">Recebemos seu pedido. Vamos ajustar e te mandar a nova versão.</p>${t.aprovacao&&t.aprovacao.comentario?`<p class="legend" style="text-align:left">${esc(t.aprovacao.comentario)}</p>`:''}</div>`;
  }else if(st!=='pendente'){
    resp=`<div class="post done"><p class="note">Este conteúdo não está aguardando aprovação no momento.</p></div>`;
  }else{
    resp=`<div class="post"><h2>Sua resposta</h2><textarea id="ajusteTxt" placeholder="Se quiser algum ajuste, descreva aqui o que mudar."></textarea><div class="actions"><button class="btn primary" data-act="ap-aprovar" data-id="${id}">${faseDe(t)==='ideia'?'Aprovar ideia':faseDe(t)==='texto'?'Aprovar texto':'Aprovar conteúdo'}</button><button class="btn" data-act="ap-ajuste" data-id="${id}">Pedir ajuste</button></div></div>`;
  }
  const na=artesDe(t).length;const fs=faseDe(t);
  const lado=fs==='final'||na?`<div>${phone(t)}${na>1?`<p class="note" style="text-align:center">Arraste para o lado para ver as ${na} imagens</p>`:''}</div>`:'';
  const ideia=fs==='ideia'&&t.briefing?`<div><b>A ideia</b><div class="legend">${esc(t.briefing)}</div></div>`:'';
  return `<div class="solo">${head}<div class="${lado?'approve-grid':''}">${lado}<div style="display:flex;flex-direction:column;gap:16px;min-width:0"><div class="post"><span class="fase">${esc(FASES[fs].titulo)}</span><span class="pill accent" style="align-self:flex-start">${cliLabel(t)}</span><h1>${esc(t.titulo)}</h1>${ideia}<span class="note">${esc(t.formato||'')}${redesDe(t).length?' · '+esc(redesTxt(t)):''}${t.data?' · publicação prevista para '+fdateL(t.data):''}</span>${linkArte}${t.legenda&&fs!=='ideia'?`<div><b>Legenda completa</b><div class="legend">${esc(t.legenda)}</div></div>`:''}</div>${resp}${conversaPublica(t)}</div></div></div>`;
}

/* ---------- CLIENTES ---------- */
function onbPct(c,key,arr){const o=c[key]||{};const n=arr.filter((_,i)=>o[i]).length;return [n,arr.length]}
function vCliente(c){
  const tab=CLI.tab;
  const tabs=[['resumo','Resumo'],['raiox','Raio-X da marca'],['feed','Prévia do feed'],['conteudos','Conteúdos'],['arquivos','Arquivos'],['onb','Onboarding'],['offb','Offboarding'],['imp','Tráfego pago']];
  let body='';
  if(tab==='resumo'){
    const ab=list('tarefas').filter(x=>x.clienteId===c.id&&x.etapa!=='publicado');
    const[a,b]=onbPct(c,'onb',ONB);
    body=`<div class="kpis">${kpi('Status',{pausado:'Pausado',encerrado:'Ex-cliente'}[c.status]||'Ativo')}${kpi('Em produção',ab.length)}${kpi('Onboarding',`${a}/${b}`)}${isAdmin&&c.mensalidade?kpi('Mensalidade',brl(c.mensalidade),c.vencimento?'Vence dia '+c.vencimento:''):''}</div>
    <dl class="dl">${[['Marcas',marcasDe(c.id).join(', ')],['Contato',c.contato],['WhatsApp',c.whatsapp],['Instagram',c.instagram],['Responsável na Clik',membroNome(c.responsavel)],['Serviços',(c.servicos||[]).join(', ')],['Cliente desde',fdateL(c.inicio)],['Observações',c.obs]].map(([k,v])=>`<div><dt>${k}</dt><dd class="${v?'':'none'}">${esc(v||'Não informado')}</dd></div>`).join('')}</dl>`;
  }else if(tab==='raiox'){
    body=vRaioX(c);
  }else if(tab==='onb'||tab==='offb'){
    const arr=tab==='onb'?ONB:OFFB,key=tab,o=c[key]||{};const[a,b]=onbPct(c,key,arr);
    body=`<section class="panel"><h2>${tab==='onb'?'Checklist de entrada':'Checklist de saída'} <span class="pill ${a===b?'ok':''}">${a}/${b}</span></h2><div class="bar"><i style="width:${a/b*100}%"></i></div><div>${arr.map((it,i)=>`<label class="check ${o[i]?'done':''}"><input type="checkbox" data-act="chk" data-id="${c.id}" data-k="${key}" data-i="${i}" ${o[i]?'checked':''} ${canWrite?'':'disabled'}><span>${esc(it)}</span></label>`).join('')}</div></section>`;
  }else if(tab==='feed'){
    body=`<section class="panel"><h2>Como o perfil vai ficar</h2><p class="note">Posts de feed e Reels em ordem de data, do mais novo para o mais antigo. Os que ainda não foram publicados mostram a data e a etapa.</p>${feedGrid(list('tarefas').filter(x=>x.clienteId===c.id),'edit-task')}</section>`;
  }else if(tab==='arquivos'){
    body=arquivosCliente(c);
  }else if(tab==='conteudos'){
    const t=list('tarefas').filter(x=>x.clienteId===c.id).sort((a,b)=>(b.data||'').localeCompare(a.data||''));
    body=`<section class="panel"><div class="rows">${t.map(x=>taskRow(x)).join('')||emptyMsg('Nenhum conteúdo para este cliente ainda.')}</div><button class="btn w" data-act="new-task" data-cli="${c.id}" style="align-self:flex-start">${ic('plus')}Novo conteúdo</button></section>`;

function alertas(x,m){
  const a=[],s=trSt(x),hoje=today(),rod=s==='rodando';
  if(rod&&x.fim&&x.fim<hoje)a.push(['bad','Passou da data de término e continua marcada como rodando.']);

  else if(m.freq>=3)a.push(['warn',`Frequência ${dec(m.freq)}: começando a saturar. Prepare criativos novos.`]);
  if(m.imp>=1000&&m.ctr<1)a.push(['warn',`CTR de ${pct(m.ctr)}, abaixo de 1%. Criativo ou público pouco atrativo.`]);

    if(+x.metaRoas&&m.g>0&&m.roas<+x.metaRoas)a.push(['bad',`ROAS ${dec(m.roas)} abaixo da meta de ${dec(x.metaRoas)}.`]);
    if(+x.metaCpa&&m.v>0&&m.cpa>+x.metaCpa)a.push(['bad',`Custo por venda de ${brl(m.cpa)}, acima da meta de ${brl(x.metaCpa)}.`]);
    if(rod&&m.g>0&&m.v===0&&m.dias>=3)a.push(['bad','Gastando há 3 dias ou mais sem nenhuma venda registrada.']);
  }else if(+x.metaCpr&&m.res>0&&m.cpr>+x.metaCpr)a.push(['bad',`Custo por resultado de ${brl(m.cpr)}, acima da meta de ${brl(x.metaCpr)}.`]);
  if(m.total&&m.g>m.total)a.push(['bad',`Gasto passou da verba aprovada (${brl(m.g)} de ${brl(m.total)}).`]);
  else if(rod&&m.total&&m.usado>=90)a.push(['warn',`Verba quase no fim: ${Math.round(m.usado)}% usado.`]);
  if(rod&&m.esperado>0&&m.g>0){if(m.g>m.esperado*1.15)a.push(['warn','Gastando acima do valor por dia planejado.']);else if(m.diasAte>=3&&m.g<m.esperado*.6)a.push(['warn','Entregando bem abaixo do orçamento. Confira público, lance e pagamento.'])}

  return a;
}

function sparkline(vals,cor,fmt){

  const d=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
  const last=pts[pts.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img"><line x1="${p}" x2="${W-p}" y1="${H-p}" y2="${H-p}" stroke="var(--line)"/><path d="${d} L${last[0]} ${H-p} L${p} ${H-p}Z" fill="${cor}" opacity=".1"/><path d="${d}" fill="none" stroke="${cor}" stroke-width="2.2"/>${pts.map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="3" fill="${cor}"/>`).join('')}<circle cx="${last[0]}" cy="${last[1]}" r="5" fill="${cor}"/><text x="${p}" y="14" font-size="11" fill="var(--muted)">máx ${fmt(max)}</text><text x="${W-p}" y="14" font-size="12" fill="var(--fg)" text-anchor="end" font-weight="700">atual ${fmt(vals[vals.length-1])}</text></svg>`;

/* ---------- LOGINS E SENHAS (cofre criptografado) ---------- */
const enc=new TextEncoder(),tdec=new TextDecoder();
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(pass,salt){const base=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encrypt(key,txt){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(txt));return{iv:b64(iv),ct:b64(ct)}}
async function decrypt(key,o){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.iv)},key,unb64(o.ct));return tdec.decode(pt)}
const plain={};
async function decryptAll(){if(!cofreKey)return;for(const a of list('acessos')){if(a.senha&&plain[a.id]===undefined){try{plain[a.id]=await decrypt(cofreKey,a.senha)}catch(e){plain[a.id]=null}}}}

  if(!cofreKey)return `<section class="panel vault"><h2>Cofre trancado</h2><p class="note">Digite a senha mestra da agência para ver os acessos.</p><div class="fld"><label for="mpU">Senha mestra</label><input id="mpU" type="password" autocomplete="current-password"></div><button class="btn primary" data-act="cofre-abrir" style="align-self:flex-start">Abrir cofre</button></section>`;
  const a=list('acessos');

  const ks=Object.keys(groups).sort((x,y)=>cliNome(x).localeCompare(cliNome(y)));

}

  else if(f.type==='files')input=`<div class="ths" id="artThumbs">${thumbsHtml()}</div><input id="${id}" name="${f.k}" type="file" accept="image/*,video/*" multiple><span class="note">${STORE&&STORE.canUpload?'Pode enviar várias imagens para carrossel ou um vídeo para Reels. A primeira é a capa. Até 20 MB por arquivo.':'Seu acesso não permite enviar arquivos.'}</span>`;
  else if(f.type==='file')input=`${v&&artUrl(v)?`<img class="art" src="${esc(artUrl(v))}" alt="Arte atual">`:''}<input id="${id}" name="${f.k}" type="file" accept="image/*"><span class="note">${STORE&&STORE.canUpload?'Imagem até 20 MB. Aparece na página de aprovação.':'Seu acesso não permite enviar imagens.'}</span>`;
  else if(f.type==='colors')input=`<div class="opts">${CORES.map((c,i)=>`<label style="padding:3px"><input type="radio" id="${id}_${i}" name="${f.k}" value="${c}" ${v===c?'checked':''}><span class="dot" style="background:${c};width:16px;height:16px"></span></label>`).join('')}</div>`;
  else input=`<input id="${id}" name="${f.k}" type="${f.type==='money'?'number':f.type||'text'}" ${f.type==='money'?'step="0.01" min="0"':''} ${f.type==='number'?'step="any" min="0"':''} value="${esc(v??'')}" ${f.ph?`placeholder="${esc(f.ph)}"`:''} ${f.ac?`autocomplete="${f.ac}"`:''}>`;
  const lab=f.type==='checks'||f.type==='colors'?`<label>${f.label}</label>`:`<label for="${id}">${f.label}</label>`;
  return `<div class="fld${full}">${lab}${input}${f.hint?`<span class="note">${f.hint}</span>`:''}</div>`;
}
function openForm({title,fields,data={},onSave,onDelete,extra,artes,after}){
  FORM={fields,onSave,onDelete,data,artes:artes||[]};
  const body=fields.map(f=>field(f,data[f.k],data)).join('');
  const del=onDelete&&canWrite?`<button type="button" class="btn danger" data-act="form-del">Excluir</button>`:'';
  openModal(title,`${body}${after||''}<div class="mfoot">${del}${extra||''}<span class="sp"></span><button type="button" class="btn ghost" data-act="close">Cancelar</button>${canWrite?'<button type="submit" class="btn primary">Salvar</button>':''}</div>`);
}
function readForm(){
  const fm=$('#mform'),out={};
  FORM.fields.forEach(f=>{
    if(f.type==='checks')out[f.k]=[...fm.querySelectorAll(`input[name="${f.k}"]:checked`)].map(i=>i.value);
    else if(f.type==='colors'){const c=fm.querySelector(`input[name="${f.k}"]:checked`);out[f.k]=c?c.value:''}
    else if(f.type==='file'){const i=fm.querySelector(`#f_${f.k}`);out[f.k]=i&&i.files[0]?i.files[0]:undefined}
    else if(f.type==='files'){const i=fm.querySelector(`#f_${f.k}`);out[f.k]=i?[...i.files]:[]}
    else{const el=fm.querySelector(`#f_${f.k}`);let v=el?el.value:'';if(f.type==='money'||f.type==='number')v=v===''?'':Number(v);out[f.k]=typeof v==='string'?v.trim():v}
  });
  return out;
}

document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act,id=el.dataset.id;
  if(act==='modal-bg'&&e.target!==el)return;
  if(el.tagName==='A')return;
  switch(act){
    case 'close':case 'modal-bg':closeModal();break;
    case 'pv-close':case 'pv-bg':closePreview();break;
    case 'tag-add':{const i=$('#f_tags');const cur=i.value.split(',').map(x=>x.trim()).filter(Boolean);if(!cur.includes(el.dataset.v))cur.push(el.dataset.v);i.value=cur.join(', ');break}
    case 'e-tab':{EDIT.tab=el.dataset.p;document.querySelectorAll('.ed-part').forEach(p=>p.hidden=p.dataset.part!==EDIT.tab);document.querySelectorAll('.ptab').forEach(b=>b.classList.toggle('on',b.dataset.p===EDIT.tab));break}
    case 'e-tag-add':{const i=$('#e_tags');const cur=i.value.split(',').map(x=>x.trim()).filter(Boolean);if(!cur.includes(el.dataset.v))cur.push(el.dataset.v);i.value=cur.join(', ');eTocou();break}
    case 'e-art-rm':EDIT.artes.splice(+el.dataset.i,1);$('#eThumbs').innerHTML=eThumbs();eTocou();break;
    case 'e-art-capa':{const i=+el.dataset.i;if(i>0){const a=EDIT.artes.splice(i,1)[0];EDIT.artes.unshift(a);$('#eThumbs').innerHTML=eThumbs();eTocou()}break}
    case 'post-del':if(el.dataset.confirm){if(await remove('tarefas',id)){EDIT.dirty=false;EDIT.id=null;location.hash='conteudo';toast('Conteúdo excluído.')}}else{el.dataset.confirm='1';el.textContent='Confirmar exclusão'}break;
    case 'send-ap':{await salvarPost();const t=S.tarefas[id];if(!t)break;
      const tem={tema:!!(t.briefing||(t.referencias||[]).length),conteudo:!!t.roteiro,midia:!!(artesDe(t).length||t.linkArte),legenda:!!t.legenda};
      FORM={fields:[],onSave:async()=>{const sel=PARTES.filter(([k])=>($('#sa_'+k)||{}).checked).map(x=>x[0]);if(!sel.length){toast('Marque pelo menos uma parte.');return false}
        const partes={};sel.forEach(k=>partes[k]={st:'aprovacao',com:'',em:Date.now(),por:'equipe'});
        const ok=await patch('tarefas',id,{partes,aprovacao:{status:'pendente',comentario:'',em:Date.now(),por:'equipe',fase:'partes'},etapa:'cliente'});
        if(ok)setTimeout(()=>{const t2=S.tarefas[id];if(t2)copiar(apMsg(t2),'Enviado para aprovação. Mensagem copiada para mandar no WhatsApp.')},50);return ok}};
      openModal('Enviar para aprovação',`<div class="fld full"><label>O que o cliente vai aprovar agora</label><div class="opts" style="flex-direction:column;align-items:flex-start">${PARTES.map(([k,l])=>{const st=partSt(t,k);return `<label><input type="checkbox" id="sa_${k}" ${tem[k]&&st!=='aprovado'?'checked':''} ${st==='aprovado'?'disabled':''}>${l} ${st!=='rascunho'?pstPill(st):''}${!tem[k]&&st==='rascunho'?' <small class="note">(vazio)</small>':''}</label>`}).join('')}</div><span class="note">O card vai para "Aguardando cliente" e a mensagem do WhatsApp é copiada. O cliente aprova ou pede ajuste em cada parte.</span></div><div class="mfoot"><span class="sp"></span><button type="button" class="btn ghost" data-act="close">Cancelar</button><button type="submit" class="btn primary">Enviar</button></div>`);break}
    case 'pt-ok':case 'pt-aj':{const k=el.dataset.p;const ta=$('#pc_'+k);const com=(ta&&ta.value||'').trim();if(act==='pt-aj'&&!com){toast('Escreva o que quer ajustar.');ta&&ta.focus();break}
      el.disabled=true;const ok=await STORE.respondParte(id,k,act==='pt-ok'?'aprovado':'ajuste',com);el.disabled=false;
      if(ok){if(ta)ta.value='';toast(act==='pt-ok'?'Aprovado. Obrigado!':'Pedido de ajuste enviado.');render()}else toast('Não deu para registrar. Fale com a agência pelo WhatsApp.');break}

function subscribe(){
  COLLS.forEach(col=>{
    if(ADMIN_COLLS.includes(col)&&!isAdmin){loaded.add(col);return}
    STORE.watch(col,(o,fresh)=>{S[col]=o;if(fresh)loaded.add(col);if(col==='acessos'&&cofreKey)decryptAll().then(schedule);schedule()},()=>{loaded.add(col);schedule()});
  });
  STORE.watchDoc('config','cofre',d=>{cofreCfg=d;schedule()});
  STORE.watchDoc('config','geral',d=>{geral=d||{};schedule()});
  setTimeout(()=>{if(loaded.size<COLLS.length){slow=true;schedule()}},10000);
}
async function loadPublic(id){
  AP.loading=true;render();
  try{const d=await STORE.publicGet(id);if(d&&d.agencia)geral={...geral,...d.agencia};if(d&&d.tarefa){S.tarefas[id]={id,...d.tarefa};if(d.tarefa.clienteId)S.clientes[d.tarefa.clienteId]={id:d.tarefa.clienteId,nome:(d.clienteInfo&&d.clienteInfo.nome)||d.cliente||'',instagram:d.clienteInfo&&d.clienteInfo.instagram||'',logoId:d.clienteInfo&&d.clienteInfo.logoId||'',cor:d.clienteInfo&&d.clienteInfo.cor||'',marcas:''}}}catch(e){}
  AP.loading=false;render();
}
async function boot(session){
  const ok=await STORE.init(session);
  if(!ok){AUTH.view='semAcesso';AUTH.email=session.user.email;dbReady=true;render();return}
  isAdmin=STORE.isAdmin;canWrite=STORE.canWrite;me=STORE.me;AUTH.view=null;dbReady=true;
  if(isPublicRoute(route))route='painel';
  subscribe();render();
}
async function start(){
  const recovery=/type=recovery/.test(location.hash);
  route=parseRoute();
  render();
  if(MODE==='supa'){
    STORE=supaStore();
    STORE.sb.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY'){AUTH.view='novaSenha';AUTH.msg='';dbReady=true;render()}});
    if(route.startsWith('aprovar-')){dbReady=true;await loadPublic(route.slice(8));return}
    if(route.startsWith('portal-')){dbReady=true;await loadPortal(route.slice(7));return}
    const s=(await STORE.sb.auth.getSession()).data.session;
    if(/access_token|type=|error=/.test(location.hash))history.replaceState(null,'',location.pathname+location.search);
    if(recovery&&s){AUTH.view='novaSenha';dbReady=true;render();return}
    if(!s){AUTH.view='entrar';dbReady=true;render();return}
    await boot(s);return;
  }
  STORE=await claudeStore();
  isAdmin=STORE.isAdmin;canWrite=STORE.canWrite;me=STORE.me;dbReady=true;
  if(STORE.ok)subscribe();
  render();
}
start();
</script>
